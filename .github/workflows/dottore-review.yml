name: Dottore Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review.
        required: true
      comment_body:
        description: Slash command body that requested the review.
        default: ""
      review_mode:
        description: Review mode for the requested pass.
        type: choice
        options: [auto, full, incremental]
        default: auto
      requested_by:
        description: GitHub login that requested the dispatch.
        default: ""
      last_reviewed_sha:
        description: Explicit Dottore-reviewed head SHA from the dispatcher, when known.
        default: ""
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      comment_body:
        type: string
        default: ""
      review_mode:
        type: string
        default: auto
      requested_by:
        type: string
        default: ""
      last_reviewed_sha:
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        required: true
      LLM_BASE_URL:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      ANTHROPIC_BASE_URL:
        required: false
      DOTTORE_TRACE_BASE_URL:
        required: false
      DOTTORE_TRACE_API_KEY:
        required: false
      DOTTORE_FINDER_BASE_URL:
        required: false
      DOTTORE_FINDER_API_KEY:
        required: false
      DOTTORE_BROAD_BASE_URL:
        required: false
      DOTTORE_BROAD_API_KEY:
        required: false
      DOTTORE_SKEPTIC_BASE_URL:
        required: false
      DOTTORE_SKEPTIC_API_KEY:
        required: false
      DOTTORE_VERIFY_BASE_URL:
        required: false
      DOTTORE_VERIFY_API_KEY:
        required: false
      DOTTORE_SCOUT_BASE_URL:
        required: false
      DOTTORE_SCOUT_API_KEY:
        required: false
      DOTTORE_HYPO_BASE_URL:
        required: false
      DOTTORE_HYPO_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: dottore-review-${{ github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PR_NUM: ${{ inputs.pr_number }}
      DOTTORE_COMMENT_BODY: ${{ inputs.comment_body }}
      DOTTORE_REVIEW_MODE: ${{ inputs.review_mode || 'auto' }}
      DOTTORE_LAST_REVIEWED_SHA: ${{ inputs.last_reviewed_sha }}
      # Comma-separated exact refs; a single ref (staging or dottore-lab) also works.
      DOTTORE_BASE_REFS: ${{ vars.DOTTORE_BASE_REFS || 'refactor,main,staging' }}
      # Never import modules from the untrusted PR working directory.
      PYTHONSAFEPATH: "1"
      DOTTORE_REVIEW_PROMPT_PATH: /tmp/dottore-review-tool/reviewer-prompt.md
      DOTTORE_REVIEW_RULES_PATH: /tmp/dottore-review-tool/rules.json
    steps:
      - name: Validate trusted tooling reference
        env:
          TOOLING_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::job.workflow_sha is unavailable, so Dottore cannot pin its own tooling."
            exit 1
          }

      - name: Checkout calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned Engine tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # In workflow_call the github context belongs to the caller; job.workflow_*
          # names the repository and commit of this workflow file itself.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .dottore-tooling
          persist-credentials: false

      - name: Preserve trusted tooling and base-branch rules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$PR_NUM" =~ ^[1-9][0-9]*$ ]] || exit 1
          BASE=$(gh pr view "$PR_NUM" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          jq -en --arg refs "$DOTTORE_BASE_REFS" --arg ref "$BASE" '$refs | split(",") | index($ref) != null' >/dev/null || {
            echo "::error::Unsupported Dottore review base ref: $BASE"
            exit 1
          }
          echo "PR_BASE_REF=$BASE" >> "$GITHUB_ENV"
          gh auth setup-git
          git fetch --force origin "$BASE:refs/remotes/origin/$BASE"
          mkdir -p /tmp/dottore-review-tool
          cp .dottore-tooling/.github/dottore-review/{dottore_review.py,requirements.txt,reviewer-prompt.md} /tmp/dottore-review-tool/
          # Lab only: logged claims for DOTTORE_LAB_STAGE=replay.
          cp .dottore-tooling/.github/dottore-review/lab-claims.json /tmp/dottore-review-tool/ 2>/dev/null || true
          # Caller-specific rules are trusted base content, never PR-head content.
          git show "origin/$BASE:.github/dottore-review/rules.json" > /tmp/dottore-review-tool/rules.json
          rm -rf .dottore-tooling

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted reviewer dependencies
        run: pip install -r /tmp/dottore-review-tool/requirements.txt

      # Repository search uses rg; without it the reviewer falls back to a slower Python walk.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep

      - name: Fetch review specimen without executing it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git fetch --force origin "pull/$PR_NUM/head:refs/remotes/dottore-review/pr-$PR_NUM"
          HEAD_SHA=$(git rev-parse "refs/remotes/dottore-review/pr-$PR_NUM")
          git checkout --detach "$HEAD_SHA"
          echo "PR_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      # Lab only: Anthropic's built-in /code-review prompt in an unmodified Claude Code CLI, read-only, through the
      # shared ANTHROPIC_* endpoint (LinkAPI). It prints the transcript and cost to the log and skips Dottore's own steps.
      # --max-budget-usd uses Claude Code's built-in prices (Opus 5.5 $4/$20 per M in/out, Haiku 5.5 $0.10/$0.50), about 3x
      # LinkAPI's claudecode rates, and is checked between turns: 0.30 on Haiku stops near $0.10 plus the turn in flight.
      - name: Lab Claude Code review
        if: vars.DOTTORE_LAB_STAGE == 'claudecode'
        timeout-minutes: 32
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5-5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-5-5
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
          CC_MODEL: claude-haiku-5-5
          CC_EFFORT: medium
          CC_BUDGET_LIST_USD: "0.30"
          CC_TIMEOUT: 23m
        run: |
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.296 >/dev/null
          echo "Dottore lab claude version: $(claude --version)"
          # Read-only: --restricted ignores settings files and project hooks and confines file tools to the checkout;
          # --tools leaves Read, Grep, Glob and Bash, and dontAsk refuses any command not listed (git inspection only).
          cat > "$RUNNER_TEMP/cc-settings.json" <<'JSON'
          {
            "permissions": {
              "allow": ["Read", "Grep", "Glob",
                "Bash(git diff)", "Bash(git diff *)", "Bash(git log)", "Bash(git log *)", "Bash(git show *)",
                "Bash(git merge-base *)", "Bash(git rev-parse *)", "Bash(git blame *)",
                "Bash(git status)", "Bash(git status *)", "Bash(git ls-files *)"],
              "deny": ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch",
                "Bash(git diff --no-index *)", "Bash(git diff --output*)", "Bash(git log --output*)",
                "Read(//proc/**)", "Read(//sys/**)", "Read(//etc/**)", "Read(//tmp/**)",
                "Read(//home/runner/.*)", "Read(//home/runner/.*/**)", "Read(//home/runner/work/_temp/**)"]
            }
          }
          JSON
          # Each event is printed as it arrives (the log's timestamps show the pace), so a slow or stuck run still leaves
          # its transcript and cost in the log. Per-message usage comes from the raw stream: an assistant event carries
          # only the start-of-message snapshot (output_tokens 1); message_delta has the real output, thinking included.
          cat > "$RUNNER_TEMP/cc-filter.jq" <<'JQ'
          . as $line | (try fromjson catch {type: "raw", raw: $line}) |
          ($tag + (if .parent_tool_use_id then "[sub] " else " " end)) as $p |
          if .type == "raw" then $p + "raw: " + (.raw | .[0:300])
          elif .type == "system" and .subtype == "init" then $p + "system: init model=" + (.model // "") + " tools=" + ((.tools // []) | join(","))
          elif .type == "system" and .subtype == "thinking_tokens" then
            select((.estimated_tokens / 2000 | floor) > ((.estimated_tokens - .estimated_tokens_delta) / 2000 | floor))
            | $p + "thinking: ~" + (.estimated_tokens | tostring) + " tokens so far (estimate)"
          elif .type == "system" then $p + "system: " + (del(.tools, .mcp_servers, .slash_commands, .agents, .skills, .plugins) | tostring | .[0:400])
          elif .type == "stream_event" and .event.type == "message_start" then
            $p + "msg start: " + (.event.message.id // "") + " " + (.event.message.model // "") + " "
              + (.event.message.usage | {input_tokens, cache_read_input_tokens, cache_creation_input_tokens} | tostring)
          elif .type == "stream_event" and .event.type == "message_delta" then
            $p + "msg end: " + (.event.delta.stop_reason // "") + " " + (.event.usage | with_entries(select(.value | type == "number")) | tostring)
          elif .type == "assistant" then
            .message.content[]? |
              if .type == "text" then $p + "text: " + .text
              elif .type == "tool_use" then $p + "tool: " + .name + " " + (.input | tostring | .[0:400])
              else empty end
          elif .type == "user" then (.message.content[]? | select(type == "object" and .type == "tool_result" and .is_error == true)
            | $p + "tool error: " + (.content | tostring | .[0:300]))
          elif .type == "result" then $tag + " result: " + (del(.result) | tostring) + "\n" + $tag + " final:\n" + (.result // "")
          else empty end
          JQ
          # $1 log tag, $2 time limit, $3 list-price budget, $4 seconds to wait for response headers, $5 retries, $6 prompt.
          # Claude Code waits 10 minutes for headers and retries 10 times by default, so a gateway that never answers
          # would hold the step silently; the header wait applies only until the stream starts, not to long answers.
          cc() {
            set +e
            API_TIMEOUT_MS=$(( $4 * 1000 )) CLAUDE_CODE_MAX_RETRIES=$5 timeout -k 30s "$2" claude -p "$6" --restricted --strict-mcp-config \
              --tools Read,Grep,Glob,Bash --model "$CC_MODEL" --effort "$CC_EFFORT" --max-budget-usd "$3" --permission-mode dontAsk \
              --settings "$RUNNER_TEMP/cc-settings.json" --output-format stream-json --verbose --include-partial-messages \
              --no-session-persistence < /dev/null | tee "$RUNNER_TEMP/$1.jsonl" \
              | jq -R -r --unbuffered --arg tag "$1" -f "$RUNNER_TEMP/cc-filter.jq"
            local codes=("${PIPESTATUS[@]}")
            set -e
            echo "Dottore lab claude $1 exit=${codes[0]} jq=${codes[2]} lines=$(wc -l < "$RUNNER_TEMP/$1.jsonl")"
          }
          # /code-review hands the review to a forked subagent that ignores --max-budget-usd and prints nothing until it
          # ends. Capture the exact prompt it gives that subagent, from a local stub (no model call, no real key), and
          # run it on the main thread instead, where the budget is checked every turn and each step streams to the log.
          cat > "$RUNNER_TEMP/cc-stub.py" <<'PY'
          import http.server, json, sys
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("content-length") or 0))
                  self.send_response(200); self.send_header("content-type", "text/event-stream"); self.end_headers()
                  for t, d in [("message_start", {"message": {"id": "stub", "type": "message", "role": "assistant", "model": "stub", "content": [],
                                                              "stop_reason": None, "usage": {"input_tokens": 0, "output_tokens": 0}}}),
                               ("content_block_start", {"index": 0, "content_block": {"type": "text", "text": ""}}),
                               ("content_block_delta", {"index": 0, "delta": {"type": "text_delta", "text": "[]"}}),
                               ("content_block_stop", {"index": 0}),
                               ("message_delta", {"delta": {"stop_reason": "end_turn"}, "usage": {"output_tokens": 1}}),
                               ("message_stop", {})]:
                      self.wfile.write(f"event: {t}\ndata: {json.dumps({'type': t, **d})}\n\n".encode())
          http.server.HTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          PY
          python3 -I "$RUNNER_TEMP/cc-stub.py" 18765 & stub=$!
          sleep 1
          ANTHROPIC_API_KEY=stub ANTHROPIC_BASE_URL=http://127.0.0.1:18765 timeout 60s claude -p "/code-review origin/$PR_BASE_REF...HEAD" \
            --restricted --strict-mcp-config --tools Read,Grep,Glob,Bash --model "$CC_MODEL" --effort "$CC_EFFORT" --permission-mode dontAsk \
            --settings "$RUNNER_TEMP/cc-settings.json" --output-format stream-json --verbose --no-session-persistence < /dev/null \
            | jq -r 'select(.type == "system" and .subtype == "task_started") | .prompt // empty' > "$RUNNER_TEMP/cc-review-prompt.txt" || true
          kill "$stub" || true
          if [ ! -s "$RUNNER_TEMP/cc-review-prompt.txt" ]; then
            echo "Dottore lab claude: could not capture the /code-review prompt; review skipped"
            exit 0
          fi
          echo "Dottore lab claude review prompt: $(wc -c < "$RUNNER_TEMP/cc-review-prompt.txt") chars: $(head -3 "$RUNNER_TEMP/cc-review-prompt.txt" | tr '\n' ' ')"
          # Preflight with the review's request shape: if the endpoint can't answer one line, skip the review. The answer
          # must be OK: a gateway that swaps the prompt for its own (billed 29 tokens, replied "你好") still returns success.
          cc PRE 4m 0.10 60 1 "Reply with the single word OK."
          if ! jq -e -s 'any(.[]; .type == "result" and .is_error == false and ((.result // "") | test("^\\W*ok\\W*$"; "i")))' \
               "$RUNNER_TEMP/PRE.jsonl" >/dev/null 2>&1; then
            echo "Dottore lab claude preflight failed: review skipped"
            exit 0
          fi
          cc CC "$CC_TIMEOUT" "$CC_BUDGET_LIST_USD" 180 3 "$(cat "$RUNNER_TEMP/cc-review-prompt.txt")"

      - name: Mark Dottore status in progress
        if: vars.DOTTORE_LAB_STAGE != 'claudecode'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state=pending -f context="Dottore Review" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="The specimen is on Dottore's observation table. Examination in progress." >/dev/null

      - name: Run Dottore review
        if: vars.DOTTORE_LAB_STAGE != 'claudecode'
        timeout-minutes: 35
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          # Optional per-role endpoints; an empty one falls back to the shared value above.
          DOTTORE_TRACE_BASE_URL: ${{ secrets.DOTTORE_TRACE_BASE_URL }}
          DOTTORE_TRACE_API_KEY: ${{ secrets.DOTTORE_TRACE_API_KEY }}
          DOTTORE_FINDER_BASE_URL: ${{ secrets.DOTTORE_FINDER_BASE_URL }}
          DOTTORE_FINDER_API_KEY: ${{ secrets.DOTTORE_FINDER_API_KEY }}
          DOTTORE_BROAD_BASE_URL: ${{ secrets.DOTTORE_BROAD_BASE_URL }}
          DOTTORE_BROAD_API_KEY: ${{ secrets.DOTTORE_BROAD_API_KEY }}
          DOTTORE_SKEPTIC_BASE_URL: ${{ secrets.DOTTORE_SKEPTIC_BASE_URL }}
          DOTTORE_SKEPTIC_API_KEY: ${{ secrets.DOTTORE_SKEPTIC_API_KEY }}
          DOTTORE_VERIFY_BASE_URL: ${{ secrets.DOTTORE_VERIFY_BASE_URL }}
          DOTTORE_VERIFY_API_KEY: ${{ secrets.DOTTORE_VERIFY_API_KEY }}
          DOTTORE_SCOUT_BASE_URL: ${{ secrets.DOTTORE_SCOUT_BASE_URL }}
          DOTTORE_SCOUT_API_KEY: ${{ secrets.DOTTORE_SCOUT_API_KEY }}
          DOTTORE_HYPO_BASE_URL: ${{ secrets.DOTTORE_HYPO_BASE_URL }}
          DOTTORE_HYPO_API_KEY: ${{ secrets.DOTTORE_HYPO_API_KEY }}
          # Model settings; .github/dottore-review/README.md describes each one.
          DOTTORE_PROVIDER: ${{ vars.DOTTORE_PROVIDER }}
          LLM_MODEL: ${{ vars.DOTTORE_MODEL || 'gpt-5.5' }}
          DOTTORE_REASONING_EFFORT: ${{ vars.DOTTORE_REASONING_EFFORT }}
          DOTTORE_MODELS: ${{ vars.DOTTORE_MODELS }}
          DOTTORE_CONCURRENCY: ${{ vars.DOTTORE_CONCURRENCY }}
          # Lab only: `trace` stops each review after the tracer, before any finder runs.
          DOTTORE_LAB_STAGE: ${{ vars.DOTTORE_LAB_STAGE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python /tmp/dottore-review-tool/dottore_review.py produce

      - name: Render review
        if: vars.DOTTORE_LAB_STAGE != 'claudecode'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python /tmp/dottore-review-tool/dottore_review.py render

      - name: Post the review
        if: vars.DOTTORE_LAB_STAGE != 'claudecode'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python /tmp/dottore-review-tool/dottore_review.py post

      - name: Complete Dottore status
        if: always() && vars.DOTTORE_LAB_STAGE != 'claudecode'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "${PR_HEAD_SHA:-}" ]; then
            PR_HEAD_SHA=$(gh pr view "$PR_NUM" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          fi
          if [ -f /tmp/dottore-review-tool/dottore_review.py ]; then
            STATUS_OUTPUT=$(python /tmp/dottore-review-tool/dottore_review.py status-state \
              --review-json review.json --job-status "$JOB_STATUS")
          else
            STATUS_OUTPUT=$(printf '%s\n' 'state=failure' \
              'description=The examination apparatus was unavailable. Inspect the trusted Dottore workflow run.')
          fi
          STATE=$(printf '%s\n' "$STATUS_OUTPUT" | sed -n 's/^state=//p')
          DESCRIPTION=$(printf '%s\n' "$STATUS_OUTPUT" | sed -n 's/^description=//p')
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state="$STATE" -f context="Dottore Review" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="$DESCRIPTION" >/dev/null
